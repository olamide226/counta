name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.0.2)'
        required: true

permissions:
  contents: write

env:
  # One pin for every job. docs/RELEASE-BACKGROUND.md explains why it must
  # equal the version you build with locally: targetSdk resolves from
  # flutter.targetSdkVersion, so a runner on an older Flutter silently targets
  # a lower API level than the artifact you verified.
  FLUTTER_VERSION: '3.44.8'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## What's New in v${{ steps.get_version.outputs.version }}
            
            ### Downloads
            - **macOS**: Download the `.dmg` file
            - **Android**: Download the `.apk` file
            - **Windows**: Download the `.zip` file

            The `.aab` file, when present, is the Play-ready bundle and is not
            installable directly — it is uploaded to the Play Console by hand.

            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.

  # Android APK (direct download / GitHub release) and, when the signing
  # secrets exist, the Play-ready AAB.
  #
  # One job: the AAB needs the same checkout, JDK, Flutter and `pub get` as the
  # APK, and a second cold runner to repeat them costs a build's worth of time
  # to produce one extra file. Only the signing-specific steps are guarded.
  #
  # Neither artifact is uploaded to Google Play. Nothing in this repository
  # holds store credentials, and promoting a track from a mistyped tag is not a
  # failure mode worth inviting.
  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      # Read by the Makefile as make variables, which is how both build targets
      # get their --dart-defines. DEEPGRAM_API_KEY is deliberately absent: a
      # --dart-define is embedded in the artifact even where the Dart-side read
      # is compile-time dead. See RELEASE_DART_DEFINES in the Makefile.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: make build-android

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: build/app/outputs/flutter-apk/app-release.apk
          asset_name: counta-${{ needs.create-release.outputs.version }}-android.apk
          asset_content_type: application/vnd.android.package-archive

      # The `secrets` context is not available in an `if`, so the presence
      # check has to be a step that publishes an output.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets not set - skipping the AAB build." \
                 "See docs/RELEASE-BACKGROUND.md, 'CI signing secrets'."
          fi

      # Written to the runner's workspace and removed by the cleanup step
      # below, which runs even when the build fails.
      - name: Write signing material
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # make build-appbundle sets ORG_GRADLE_PROJECT_requireReleaseSigning, so
      # a missing or half-written key.properties fails at configuration rather
      # than attaching a debug-signed AAB that looks identical until Play
      # rejects it.
      - name: Build AAB
        if: steps.signing.outputs.available == 'true'
        run: make build-appbundle

      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - name: Upload AAB to Release
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: build/app/outputs/bundle/release/app-release.aab
          asset_name: counta-${{ needs.create-release.outputs.version }}-android.aab
          asset_content_type: application/octet-stream

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Counta Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Counta.app" 200 190 \
            --hide-extension "Counta.app" \
            --app-drop-link 600 185 \
            "counta-${{ needs.create-release.outputs.version }}-macos.dmg" \
            "build/macos/Build/Products/Release/counta.app" || \
          hdiutil create -volname "Counta" -srcfolder build/macos/Build/Products/Release/counta.app -ov -format UDZO counta-${{ needs.create-release.outputs.version }}-macos.dmg

      - name: Upload DMG to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: counta-${{ needs.create-release.outputs.version }}-macos.dmg
          asset_name: counta-${{ needs.create-release.outputs.version }}-macos.dmg
          asset_content_type: application/x-apple-diskimage

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Create Windows ZIP
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath counta-${{ needs.create-release.outputs.version }}-windows.zip

      - name: Upload Windows ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: counta-${{ needs.create-release.outputs.version }}-windows.zip
          asset_name: counta-${{ needs.create-release.outputs.version }}-windows.zip
          asset_content_type: application/zip
